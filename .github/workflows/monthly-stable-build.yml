name: Monthly stable example builds

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download stable Bob
        run: python download_bob.py --channel stable --output bob.jar
      - name: Build all examples
        run: python build_examples.py --bob-jar bob.jar --keep-going

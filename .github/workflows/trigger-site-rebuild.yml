name: Trigger site rebuild

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Validate, build, archive, and publish all examples'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - 'master'
    paths:
      - '*/*/**'
      - '.github/workflows/validate-examples.yml'
      - '.github/workflows/trigger-site-rebuild.yml'
      - 'validate_examples.py'
      - 'test_validate_examples.py'
      - 'test_build_examples.py'
      - 'test_build_snapshot.py'
      - 'build_examples.py'
      - 'build_snapshot.py'
      - 'download_bob.py'
      - 'create_archives.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: examples-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip-ci')"
    steps: [
      { name: 'Checkout', uses: actions/checkout@v4, with: { fetch-depth: 0 } },
      { name: 'Install Python', uses: actions/setup-python@v4, with: { python-version: 3.10.22, architecture: x64 } },
      {
        name: 'Test example validation',
        run: 'python -m unittest test_validate_examples.py test_build_examples.py test_build_snapshot.py'
      },
      {
        name: 'Validate examples',
        env: {
          BEFORE_SHA: '${{ github.event.before }}',
          AFTER_SHA: '${{ github.sha }}',
          FULL_REBUILD: '${{ github.event_name == ''workflow_dispatch'' && inputs.full_rebuild }}'
        },
        run: 'python validate_examples.py'
      }
    ]

  build:
    runs-on: ubuntu-latest
    needs: validate
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip-ci')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v4
        with: { python-version: '3.10.22', architecture: x64 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Download beta Bob
        run: python download_bob.py --channel beta --output bob.jar
      - name: Restore latest successful snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          gh run list --workflow trigger-site-rebuild.yml --branch master --status success --limit 50 --json databaseId --jq '.[].databaseId' > previous/runs.txt
          while read -r run_id; do
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.name == "examples-bundles" and .expired == false) | .id')
            if [ -n "$artifact_id" ]; then
              gh run download "$run_id" --name examples-bundles --dir previous
              break
            fi
          done < previous/runs.txt
      - name: Build complete bundle snapshot
        env:
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_rebuild }}
        run: |
          args=()
          if [ "$FULL_REBUILD" = true ]; then args+=(--full); elif [ -f previous/examples-bundles.zip ]; then args+=(--baseline previous/examples-bundles.zip); fi
          python build_snapshot.py --bob-jar bob.jar "${args[@]}"
      - name: Upload bundle snapshot
        uses: actions/upload-artifact@v4
        with:
          name: examples-bundles
          path: examples-bundles.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip-ci')"
    steps: [
      { name: 'Checkout', uses: actions/checkout@v4, with: { fetch-depth: 1 } },
      { name: 'Install Python', uses: actions/setup-python@v4, with: { python-version: 3.10.22, architecture: x64 } },
      {
        name: 'Create archives',
        run: 'python create_archives.py'
      },
      {
        name: "Create tag",
        run: 'git rev-parse v${{ github.sha }} >/dev/null 2>&1 || git tag v${{ github.sha }}'
      },
      {
        name: "Push to tag",
        run: 'git push origin v${{ github.sha }}'
      },
      {
        name: 'Release',
        uses: softprops/action-gh-release@v2,
        with: { files: "*.zip", make_latest: true, tag_name: 'v${{ github.sha }}' }
      },
      {
        name: 'Repository dispatch',
        env: {
          DISPATCH_TOKEN: '${{ secrets.SERVICES_GITHUB_TOKEN }}',
          EXAMPLES_RUN_ID: '${{ github.run_id }}'
        },
        run: 'python -c ''import json, os; print(json.dumps({"event_type":"examples","client_payload":{"examples_sha":os.environ["GITHUB_SHA"],"examples_run_id":os.environ["EXAMPLES_RUN_ID"]}}))'' > dispatch.json && curl --fail --request POST --url https://api.github.com/repos/defold/defold.github.io/dispatches --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${DISPATCH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" --data @dispatch.json'
      }
    ]
